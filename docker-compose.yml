services:
  sopandgo:
    image: ghcr.io/sopandgo/sopandgo:1
    # No host port. Coolify runs this file alone (`-f docker-compose.yml`) and
    # reaches Caddy on :80 through its proxy, so a second instance on the same
    # server does not fight over 8087. A local `docker compose up` also loads
    # docker-compose.override.yml, which publishes HOST_WEB_PORT.
    expose:
      - "80"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATA_DIR=/app/data
      # true seeds demo users and the sample SOPs on first start (no effect once app.db exists).
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      # Read-only public demo. Wipes and reseeds the data directory at every start.
      # Never set it on a real lab; see docs/ops/deployment.md#demo-mode.
      - DEMO_MODE=${DEMO_MODE:-false}
      # Umami analytics for the public demo. Ignored unless DEMO_MODE is true.
      - UMAMI_SCRIPT_URL=${UMAMI_SCRIPT_URL:-}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_DOMAINS=${UMAMI_DOMAINS:-}
      # Must match the URL users type in the browser (scheme + host + port if non-default).
      # Override in `.env` for production. The local default matches HOST_WEB_PORT
      # in docker-compose.override.yml (8087).
      - ORIGIN=${ORIGIN:-http://localhost:8087}
      - BACKEND_URL=${BACKEND_URL:-http://127.0.0.1:8080}
      - HOST_HEADER=${HOST_HEADER:-x-forwarded-host}
      - PROTOCOL_HEADER=${PROTOCOL_HEADER:-x-forwarded-proto}
      # Addresses of an outer reverse proxy (Coolify, Traefik) whose X-Forwarded-For Caddy trusts,
      # so rate limits apply per visitor. Empty = trust none. See docs/ops/deployment.md.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-52428800}
      - AUDIT_STRICT_TYPES=${AUDIT_STRICT_TYPES:-false}
      # Empty = the backend default (5s). AUDIT_BUSY_TIMEOUT is the deprecated name; DB_BUSY_TIMEOUT wins.
      - DB_BUSY_TIMEOUT=${DB_BUSY_TIMEOUT:-}
      - AUDIT_BUSY_TIMEOUT=${AUDIT_BUSY_TIMEOUT:-}
      # Set in `.env` (openssl rand -base64 32). Encrypts stored SMTP, integration and S3 backup secrets.
      # Empty = those secrets cannot be saved until configured.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
      - PDF_EXPORT_ENABLED=${PDF_EXPORT_ENABLED:-true}
      - PDF_RENDERER=${PDF_RENDERER:-gotenberg}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - PDF_GENERATOR_VERSION=${PDF_GENERATOR_VERSION:-1}
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-disable-javascript=true
    restart: unless-stopped
