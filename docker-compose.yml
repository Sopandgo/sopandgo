services:
  sopandgo:
    build:
      context: .
      args:
        # Footer and backup manifests. Set in .env for a release image; otherwise "dev".
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${HOST_WEB_PORT:-8087}:80"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATA_DIR=/app/data
      # false skips demo users and the sample SOP on first start (no effect once app.db exists).
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      # Must match the URL users type in the browser (scheme + host + port if non-default).
      # Override in `.env` for production; default matches HOST_WEB_PORT below.
      - ORIGIN=${ORIGIN:-http://localhost:8087}
      - BACKEND_URL=${BACKEND_URL:-http://127.0.0.1:8080}
      - HOST_HEADER=${HOST_HEADER:-x-forwarded-host}
      - PROTOCOL_HEADER=${PROTOCOL_HEADER:-x-forwarded-proto}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-52428800}
      # Set in `.env` for SMTP (openssl rand -base64 32). Empty = SMTP disabled until configured.
      - SMTP_SECRET_ENCRYPTION_KEY=${SMTP_SECRET_ENCRYPTION_KEY:-}
      - PDF_EXPORT_ENABLED=${PDF_EXPORT_ENABLED:-true}
      - PDF_RENDERER=${PDF_RENDERER:-gotenberg}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - PDF_GENERATOR_VERSION=${PDF_GENERATOR_VERSION:-1}
      - APP_VERSION=${APP_VERSION:-dev}
      # Optional S3 scheduled backups (see .env.example and docs/ops/backup-and-restore.md)
      - BACKUP_S3_ENABLED=${BACKUP_S3_ENABLED:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-}
      - BACKUP_S3_INTERVAL=${BACKUP_S3_INTERVAL:-}
      - BACKUP_S3_RETENTION_MAX=${BACKUP_S3_RETENTION_MAX:-}
      - BACKUP_S3_RETENTION_DAYS=${BACKUP_S3_RETENTION_DAYS:-}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_USE_PATH_STYLE=${BACKUP_S3_USE_PATH_STYLE:-}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-disable-javascript=true
    restart: unless-stopped
