services:
  sopandgo:
    image: ghcr.io/sopandgo/sopandgo:1
    ports:
      - "${HOST_WEB_PORT:-8087}:80"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATA_DIR=/app/data
      # false skips demo users and the sample SOPs on first start (no effect once app.db exists).
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      # Must match the URL users type in the browser (scheme + host + port if non-default).
      # Override in `.env` for production; default matches HOST_WEB_PORT below.
      - ORIGIN=${ORIGIN:-http://localhost:8087}
      - BACKEND_URL=${BACKEND_URL:-http://127.0.0.1:8080}
      - HOST_HEADER=${HOST_HEADER:-x-forwarded-host}
      - PROTOCOL_HEADER=${PROTOCOL_HEADER:-x-forwarded-proto}
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-52428800}
      - AUDIT_STRICT_TYPES=${AUDIT_STRICT_TYPES:-false}
      - AUDIT_BUSY_TIMEOUT=${AUDIT_BUSY_TIMEOUT:-5s}
      # Set in `.env` (openssl rand -base64 32). Encrypts stored SMTP, integration and S3 backup secrets.
      # Empty = those secrets cannot be saved until configured.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
      - PDF_EXPORT_ENABLED=${PDF_EXPORT_ENABLED:-true}
      - PDF_RENDERER=${PDF_RENDERER:-gotenberg}
      - GOTENBERG_URL=${GOTENBERG_URL:-http://gotenberg:3000}
      - PDF_GENERATOR_VERSION=${PDF_GENERATOR_VERSION:-1}
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-disable-javascript=true
    restart: unless-stopped
